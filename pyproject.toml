[project]
name = "itsm-automation"
version = "0.1.0"
description = "AI-Assisted Workflow & ITSM Ticketing Automation Platform"
authors = [{ name = "Portfolio Project" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "faker>=24.0.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.3",
    "pyyaml>=6.0.1",
    "pandas>=2.2.1",
    "pm4py>=2.7.11",
    "streamlit>=1.32.0",
    "msal>=1.27.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "respx>=0.21.1",
    "ruff>=0.3.2",
    "mypy>=1.9.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
